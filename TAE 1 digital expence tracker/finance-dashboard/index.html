<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Digital Personal Finance Dashboard</title>

  <!-- Tailwind CSS via CDN — no installation or build step needed -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Our own custom stylesheet -->
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-slate-100 min-h-screen">


    <!-- ===== Header ===== -->
  <header class="bg-slate-800 text-white py-6 px-4 shadow-md">
    <div class="max-w-6xl mx-auto">
      <h1 class="text-2xl md:text-3xl font-bold">Digital Personal Finance Dashboard</h1>
      <p class="text-slate-300 mt-1">Track your income, expenses, and savings goals</p>
    </div>
  </header>

  <main>

       <!-- ===== Dashboard Summary Cards ===== -->
    <section id="dashboard-cards" class="max-w-6xl mx-auto px-4 mt-6">
      <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">

        <!-- Total Income Card -->
        <div class="bg-white rounded-lg shadow p-5 border-l-4 border-green-500">
          <p class="text-sm text-slate-500 font-medium">Total Income</p>
          <p id="total-income" class="text-2xl font-bold text-green-600 mt-1">₹0</p>
        </div>

        <!-- Total Expenses Card -->
        <div class="bg-white rounded-lg shadow p-5 border-l-4 border-red-500">
          <p class="text-sm text-slate-500 font-medium">Total Expenses</p>
          <p id="total-expenses" class="text-2xl font-bold text-red-600 mt-1">₹0</p>
        </div>

        <!-- Current Balance Card -->
        <div class="bg-white rounded-lg shadow p-5 border-l-4 border-blue-500">
          <p class="text-sm text-slate-500 font-medium">Current Balance</p>
          <p id="current-balance" class="text-2xl font-bold text-blue-600 mt-1">₹0</p>
        </div>

        <!-- Savings Rate Card -->
        <div class="bg-white rounded-lg shadow p-5 border-l-4 border-amber-500">
          <p class="text-sm text-slate-500 font-medium">Savings Rate</p>
          <p id="savings-rate" class="text-2xl font-bold text-amber-600 mt-1">0%</p>
        </div>

      </div>
    </section>

    <!-- ===== Add Transaction Form — built in Phase 3 ===== -->
    <section id="add-transaction">
      <h2>Add Transaction</h2>
      <!-- Form goes here -->
    </section>

    <!-- ===== Transactions Table — built in Phase 4 ===== -->
    <section id="transactions">
      <h2>Transactions</h2>
      <!-- Table goes here -->
    </section>

    <!-- ===== Savings Goals — built in Phase 9 ===== -->
    <section id="savings-goals">
      <h2>Savings Goals</h2>
      <!-- Goals list goes here -->
    </section>

    <!-- ===== Expense Analysis Chart — built in Phase 10 ===== -->
    <section id="expense-analysis">
      <h2>Expense Analysis</h2>
      <!-- Chart.js chart goes here -->
    </section>

  </main>

  <!-- Our own JavaScript, loaded last so the page content exists before the script runs -->
  <script src="js/app.js"></script>

</body>
</html>
