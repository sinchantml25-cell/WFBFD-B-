<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sinchan Tambe CM25054</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 min-h-screen flex items-center justify-center p-4 font-sans text-slate-100">

  <!-- Card Container: Dark Slate with subtle glowing border -->
  <div class="w-full max-w-md bg-slate-900/95 backdrop-blur-xl rounded-3xl shadow-2xl shadow-cyan-950/50 border border-slate-800 p-6 sm:p-8">
    
    <!-- Header -->
    <div class="text-center mb-6">
      <span class="inline-block px-3 py-1 text-xs font-bold tracking-wider text-cyan-300 bg-cyan-950/80 rounded-full mb-2 uppercase border border-cyan-800/60 shadow-inner">
        Academic Portal
      </span>
      <h1 class="text-2xl font-black tracking-tight text-transparent bg-clip-text bg-gradient-to-r from-teal-300 via-cyan-400 to-rose-400">
        Student Grade Calculator
      </h1>
      <p class="text-xs sm:text-sm text-slate-400 mt-1">Enter marks for 3 subjects (out of 100 each)</p>
    </div>

    <!-- Form -->
    <form id="gradeForm" class="space-y-4">
      <!-- Subject 1 -->
      <div>
        <label for="sub1" class="block text-xs font-semibold uppercase tracking-wider text-slate-300 mb-1">
          Subject 1 Marks
        </label>
        <input 
          type="number" 
          id="sub1" 
          min="0" 
          max="100" 
          placeholder="0 - 100" 
          required
          class="w-full px-4 py-2.5 rounded-xl border border-slate-700 bg-slate-800/80 text-white placeholder-slate-500 focus:bg-slate-800 focus:ring-2 focus:ring-cyan-400 focus:border-cyan-400 outline-none transition shadow-inner"
        />
      </div>

      <!-- Subject 2 -->
      <div>
        <label for="sub2" class="block text-xs font-semibold uppercase tracking-wider text-slate-300 mb-1">
          Subject 2 Marks
        </label>
        <input 
          type="number" 
          id="sub2" 
          min="0" 
          max="100" 
          placeholder="0 - 100" 
          required
          class="w-full px-4 py-2.5 rounded-xl border border-slate-700 bg-slate-800/80 text-white placeholder-slate-500 focus:bg-slate-800 focus:ring-2 focus:ring-cyan-400 focus:border-cyan-400 outline-none transition shadow-inner"
        />
      </div>

      <!-- Subject 3 -->
      <div>
        <label for="sub3" class="block text-xs font-semibold uppercase tracking-wider text-slate-300 mb-1">
          Subject 3 Marks
        </label>
        <input 
          type="number" 
          id="sub3" 
          min="0" 
          max="100" 
          placeholder="0 - 100" 
          required
          class="w-full px-4 py-2.5 rounded-xl border border-slate-700 bg-slate-800/80 text-white placeholder-slate-500 focus:bg-slate-800 focus:ring-2 focus:ring-cyan-400 focus:border-cyan-400 outline-none transition shadow-inner"
        />
      </div>

      <!-- Controls -->
      <div class="flex gap-3 pt-2">
        <button 
          type="submit" 
          class="flex-1 bg-gradient-to-r from-teal-500 via-cyan-500 to-rose-500 hover:from-teal-400 hover:via-cyan-400 hover:to-rose-400 text-slate-950 font-bold py-2.5 rounded-xl shadow-lg shadow-cyan-500/20 hover:shadow-cyan-500/40 transition active:scale-[0.98]"
        >
          Calculate Result
        </button>
        <button 
          type="button" 
          id="resetBtn" 
          class="px-5 bg-slate-800 hover:bg-slate-700 text-slate-300 font-semibold py-2.5 rounded-xl border border-slate-700 transition active:scale-[0.98]"
        >
          Reset
        </button>
      </div>
    </form>

    <!-- Results Panel -->
    <div id="resultsCard" class="hidden mt-6 pt-5 border-t border-slate-800">
      <div class="bg-slate-800/50 rounded-2xl p-4 space-y-3 border border-slate-700/70 shadow-inner">
        
        <div class="flex justify-between items-center text-sm">
          <span class="text-slate-400 font-medium">Total Marks:</span>
          <span id="totalMarks" class="font-bold text-slate-100">0 / 300</span>
        </div>

        <div class="flex justify-between items-center text-sm">
          <span class="text-slate-400 font-medium">Percentage:</span>
          <span id="percentage" class="font-bold text-slate-100">0%</span>
        </div>

        <div class="flex justify-between items-center text-sm">
          <span class="text-slate-400 font-medium">Grade:</span>
          <span id="gradeBadge" class="px-3 py-0.5 rounded-full text-xs font-bold"></span>
        </div>

        <div class="flex justify-between items-center text-sm pt-2 border-t border-slate-700/60">
          <span class="text-slate-400 font-medium">Final Status:</span>
          <span id="statusText" class="font-bold text-sm"></span>
        </div>

      </div>
    </div>

  </div>

  <script>
    const form = document.getElementById('gradeForm');
    const resetBtn = document.getElementById('resetBtn');
    const resultsCard = document.getElementById('resultsCard');

    form.addEventListener('submit', function (e) {
      e.preventDefault();

      const s1 = parseFloat(document.getElementById('sub1').value) || 0;
      const s2 = parseFloat(document.getElementById('sub2').value) || 0;
      const s3 = parseFloat(document.getElementById('sub3').value) || 0;

      const marks = [s1, s2, s3];

      if (marks.some(m => m < 0 || m > 100)) {
        alert('Please enter valid marks between 0 and 100.');
        return;
      }

      const total = s1 + s2 + s3;
      const totalMax = 300;
      const percentage = (total / totalMax) * 100;

      let grade = '';
      if (percentage >= 90) grade = 'A+';
      else if (percentage >= 80) grade = 'A';
      else if (percentage >= 70) grade = 'B';
      else if (percentage >= 60) grade = 'C';
      else if (percentage >= 50) grade = 'D';
      else if (percentage >= 40) grade = 'E';
      else grade = 'F';

      const hasPassedAllSubjects = marks.every(m => m >= 35);
      const isPass = percentage >= 40 && hasPassedAllSubjects;

      document.getElementById('totalMarks').textContent = `${total} / ${totalMax}`;
      document.getElementById('percentage').textContent = `${percentage.toFixed(2)}%`;

      const badge = document.getElementById('gradeBadge');
      badge.textContent = grade;
      badge.className = isPass 
        ? 'px-3 py-0.5 rounded-full text-xs font-bold bg-teal-950 text-teal-300 border border-teal-600/50 shadow-sm' 
        : 'px-3 py-0.5 rounded-full text-xs font-bold bg-rose-950 text-rose-300 border border-rose-600/50 shadow-sm';

      const statusText = document.getElementById('statusText');
      statusText.textContent = isPass ? 'PASSED' : 'FAILED / REAPPEAR';
      statusText.className = isPass ? 'font-bold text-teal-400' : 'font-bold text-rose-400';

      resultsCard.classList.remove('hidden');
    });

    resetBtn.addEventListener('click', function () {
      form.reset();
      resultsCard.classList.add('hidden');
    });
  </script>
</body>
</html>
