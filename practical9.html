<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title> Sinchan Tambe CM25054</title>
  <!-- Tailwind CSS via CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Inter Font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; }
  </style>
</head>
<body class="bg-slate-100 min-h-screen text-slate-100 flex items-center justify-center p-4 sm:p-6 lg:p-8">

  <div class="w-full max-w-2xl bg-slate-700/80 backdrop-blur-xl border border-slate-700/60 rounded-2xl shadow-2xl p-6 sm:p-8">
    
    <!-- App Header -->
    <header class="flex flex-col sm:flex-row sm:items-center sm:justify-between pb-6 mb-6 border-b border-slate-700/70 gap-3">
      <div>
        <div class="inline-flex items-center gap-2 px-2.5 py-1 rounded-full text-xs font-semibold bg-indigo-500/10 text-indigo-400 border border-indigo-500/20 mb-2">
          <span>Student Portal</span> • <span>CM25054</span>
        </div>
        <h1 class="text-2xl sm:text-3xl font-bold tracking-tight text-white">Daily Tasks</h1>
        <p class="text-slate-400 text-xs sm:text-sm mt-0.5">Track your academic milestones and personal priorities.</p>
      </div>
      <div class="text-right sm:self-end">
        <span id="task-stats" class="text-xs font-medium text-slate-400">0 tasks remaining</span>
      </div>
    </header>

    <!-- Task Input Form -->
    <form id="task-form" class="flex flex-col sm:flex-row gap-2.5 mb-6">
      <input
        type="text"
        id="task-input"
        placeholder="Add a new task (e.g. Math Problem Set 3)..."
        class="flex-1 px-4 py-2.5 bg-slate-900/80 border border-slate-700 text-slate-100 placeholder-slate-500 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-500/50 focus:border-indigo-500 text-sm transition-all shadow-inner"
        required
      />
      <select
        id="category-select"
        class="px-3.5 py-2.5 bg-slate-900/80 border border-slate-700 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-500/50 focus:border-indigo-500 text-xs font-semibold text-slate-300 transition-all cursor-pointer"
      >
        <option value="Academic">📚 Academic</option>
        <option value="Personal">👤 Personal</option>
      </select>
      <button
        type="submit"
        class="px-5 py-2.5 bg-indigo-600 hover:bg-indigo-500 text-white font-medium rounded-xl text-sm transition-all duration-150 shadow-lg shadow-indigo-600/30 flex items-center justify-center gap-1.5 active:scale-[0.98]"
      >
        <span>Add</span>
        <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M12 4v16m8-8H4" />
        </svg>
      </button>
    </form>

    <!-- Filter Navigation -->
    <div class="flex items-center justify-between gap-3 mb-5">
      <div class="inline-flex p-1 bg-slate-900/80 border border-slate-700/60 rounded-xl text-xs font-medium">
        <button onclick="setFilter('all')" id="filter-all" class="px-3.5 py-1.5 rounded-lg bg-indigo-600 text-white font-semibold shadow-sm transition-all">All</button>
        <button onclick="setFilter('Academic')" id="filter-Academic" class="px-3.5 py-1.5 rounded-lg text-slate-400 hover:text-white transition-all">Academic</button>
        <button onclick="setFilter('Personal')" id="filter-Personal" class="px-3.5 py-1.5 rounded-lg text-slate-400 hover:text-white transition-all">Personal</button>
      </div>
      
      <!-- Clear Completed Button -->
      <button onclick="clearCompleted()" class="text-xs text-slate-500 hover:text-slate-300 transition-colors">Clear Done</button>
    </div>

    <!-- Task List Container -->
    <ul id="task-list" class="space-y-2.5">
      <!-- Dynamic task items injected via JS -->
    </ul>

    <!-- Empty State -->
    <div id="empty-state" class="text-center py-12 text-slate-500 text-sm hidden border border-dashed border-slate-700/50 rounded-xl bg-slate-900/20">
      <svg xmlns="http://www.w3.org/2000/svg" class="w-10 h-10 mx-auto text-slate-600 mb-2 stroke-1" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2" />
      </svg>
      No tasks found in this view.
    </div>

  </div>

  <!-- Application Logic -->
  <script>
    let tasks = JSON.parse(localStorage.getItem('student_tasks')) || [];
    let currentFilter = 'all';
    let editingTaskId = null;

    const taskForm = document.getElementById('task-form');
    const taskInput = document.getElementById('task-input');
    const categorySelect = document.getElementById('category-select');
    const taskList = document.getElementById('task-list');
    const emptyState = document.getElementById('empty-state');
    const taskStats = document.getElementById('task-stats');

    function saveTasks() {
      localStorage.setItem('student_tasks', JSON.stringify(tasks));
      render();
    }

    taskForm.addEventListener('submit', (e) => {
      e.preventDefault();
      const text = taskInput.value.trim();
      if (!text) return;

      tasks.unshift({
        id: Date.now(),
        text: text,
        category: categorySelect.value,
        completed: false
      });

      taskInput.value = '';
      saveTasks();
    });

    function toggleComplete(id) {
      tasks = tasks.map(task => 
        task.id === id ? { ...task, completed: !task.completed } : task
      );
      saveTasks();
    }

    function deleteTask(id) {
      tasks = tasks.filter(task => task.id !== id);
      if (editingTaskId === id) editingTaskId = null;
      saveTasks();
    }

    function clearCompleted() {
      tasks = tasks.filter(task => !task.completed);
      saveTasks();
    }

    function startEdit(id) {
      editingTaskId = id;
      render();
    }

    function cancelEdit() {
      editingTaskId = null;
      render();
    }

    function saveEdit(id) {
      const inputEl = document.getElementById(`edit-input-${id}`);
      if (!inputEl) return;
      const newText = inputEl.value.trim();
      if (!newText) return;

      tasks = tasks.map(task => 
        task.id === id ? { ...task, text: newText } : task
      );
      editingTaskId = null;
      saveTasks();
    }

    function setFilter(filter) {
      currentFilter = filter;
      ['all', 'Academic', 'Personal'].forEach(f => {
        const btn = document.getElementById(`filter-${f}`);
        if (btn) {
          btn.className = f === filter
            ? 'px-3.5 py-1.5 rounded-lg bg-indigo-600 text-white font-semibold shadow-sm transition-all'
            : 'px-3.5 py-1.5 rounded-lg text-slate-400 hover:text-white transition-all';
        }
      });
      render();
    }

    function render() {
      taskList.innerHTML = '';

      const filteredTasks = tasks.filter(task => {
        if (currentFilter === 'Academic') return task.category === 'Academic';
        if (currentFilter === 'Personal') return task.category === 'Personal';
        return true;
      });

      emptyState.classList.toggle('hidden', filteredTasks.length > 0);

      filteredTasks.forEach(task => {
        const li = document.createElement('li');
        const isEditing = task.id === editingTaskId;

        li.className = `group flex items-center justify-between p-3.5 rounded-xl border transition-all duration-150 ${
          task.completed 
            ? 'bg-slate-900/40 border-slate-800 opacity-60' 
            : 'bg-slate-900/60 border-slate-700/60 hover:border-slate-600 shadow-sm'
        }`;

        const isAcademic = task.category === 'Academic';
        const badgeClasses = isAcademic 
          ? 'bg-sky-500/10 text-sky-400 border-sky-500/20' 
          : 'bg-emerald-500/10 text-emerald-400 border-emerald-500/20';

        if (isEditing) {
          li.innerHTML = `
            <div class="flex items-center gap-2 flex-1 mr-2">
              <input
                type="text"
                id="edit-input-${task.id}"
                value="${escapeHtml(task.text)}"
                class="flex-1 px-3 py-1.5 bg-slate-900 border border-indigo-500 rounded-lg text-slate-100 text-sm focus:outline-none ring-2 ring-indigo-500/30"
              />
            </div>
            <div class="flex items-center gap-1.5 shrink-0">
              <button onclick="saveEdit(${task.id})" class="px-3 py-1 bg-indigo-600 hover:bg-indigo-500 text-white rounded-lg text-xs font-semibold transition-colors">Save</button>
              <button onclick="cancelEdit()" class="px-3 py-1 bg-slate-700 hover:bg-slate-600 text-slate-300 rounded-lg text-xs font-semibold transition-colors">Cancel</button>
            </div>
          `;
        } else {
          li.innerHTML = `
            <div class="flex items-center gap-3 min-w-0 pr-3 flex-1">
              <input
                type="checkbox"
                ${task.completed ? 'checked' : ''}
                onchange="toggleComplete(${task.id})"
                class="w-4 h-4 rounded border-slate-700 bg-slate-800 text-indigo-600 focus:ring-0 focus:ring-offset-0 cursor-pointer accent-indigo-600"
              />
              <span class="text-[11px] px-2.5 py-0.5 rounded-full font-medium border ${badgeClasses} shrink-0">
                ${task.category}
              </span>
              <span class="text-sm truncate select-none ${task.completed ? 'line-through text-slate-500' : 'text-slate-200'}">
                ${escapeHtml(task.text)}
              </span>
            </div>
            <div class="flex items-center gap-1 shrink-0 opacity-80 group-hover:opacity-100 transition-opacity">
              <button onclick="startEdit(${task.id})" class="p-1.5 text-slate-400 hover:text-indigo-400 rounded-md transition-colors" title="Edit">
                <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.572L16.732 3.732z" />
                </svg>
              </button>
              <button onclick="deleteTask(${task.id})" class="p-1.5 text-slate-400 hover:text-rose-400 rounded-md transition-colors" title="Delete">
                <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
                </svg>
              </button>
            </div>
          `;
        }
        taskList.appendChild(li);

        if (isEditing) {
          const editInput = document.getElementById(`edit-input-${task.id}`);
          if (editInput) {
            editInput.focus();
            editInput.select();
            editInput.addEventListener('keydown', (e) => {
              if (e.key === 'Enter') saveEdit(task.id);
              if (e.key === 'Escape') cancelEdit();
            });
          }
        }
      });

      const activeCount = tasks.filter(t => !t.completed).length;
      taskStats.textContent = `${activeCount} task${activeCount === 1 ? '' : 's'} remaining`;
    }

    function escapeHtml(str) {
      return str.replace(/[&<>"']/g, match => ({
        '&': '&amp;',
        '<': '&lt;',
        '>': '&gt;',
        '"': '&quot;',
        "'": '&#39;'
      }[match]));
    }

    render();
  </script>
</body>
</html>
